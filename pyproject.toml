[project]
name = "ComfyUI"
version = "0.9.1"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12" # select 3.11
dependencies = [
    "aiohttp>=3.11.8",
    "alembic>=1.16.5",
    "av>=14.2.0",
    "comfyui-embedded-docs==0.4.0",
    "comfyui-frontend-package==1.36.14",
    "comfyui-workflow-templates==0.8.4",
    "einops>=0.8.1",
    "kornia>=0.7.1",
    "numpy>=1.25.0",
    "pillow>=11.3.0",
    "psutil>=7.1.3",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pyyaml>=6.0.3",
    "safetensors>=0.4.2",
    "scipy>=1.13.1",
    "sentencepiece>=0.2.1",
    "spandrel>=0.4.1",
    "sqlalchemy>=2.0.45",
    "tokenizers>=0.13.3",
    "pytorch-triton-rocm>=3.1.0",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchsde>=0.2.6",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "transformers>=4.50.3",
    "yarl>=1.18.0",
    "trimesh[easy]>=4.10.1",
    "pymeshlab>=2025.7",
    "pygltflib>=1.16.5",
    "xatlas>=0.0.11",
    "open3d>=0.19.0",
    "omegaconf>=2.3.0",
    "configargparse>=1.7.1",
    "diffusers>=0.36.0",
    "accelerate>=0.30.0",
    "pytorch-lightning>=2.6.0",
    "opencv-python>=4.7.0.72",
    "huggingface-hub>=0.30.0",
    "scikit-image>=0.25.2",
    "pybind11>=3.0.1",
    "timm>=1.0.22",
    "meshlib>=3.0.9.196",
    "rembg>=2.0.69",
    "onnxruntime>=1.23.2",
    "importlib-metadata>=8.7.0",
    "filelock>=3.20.0",
    "python-dateutil>=2.9.0.post0",
    "mediapipe>=0.10.21",
    "fvcore>=0.1.5.post20221221",
    "yapf>=0.43.0",
    "ftfy>=6.3.1",
    "addict>=2.4.0",
    "yacs>=0.1.8",
    "albumentations>=2.0.8",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.8",
    "argostranslate>=1.10.0",
    "comfy-kitchen>=0.2.6",
    "fbxsdkpy==2020.1.post2",
    "torchdiffeq>=0.2.5",
    "transforms3d>=0.4.2",
    "bitsandbytes>=0.42.0",
    "imageio[ffmpeg]>=2.37.2",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[[tool.uv.index]]
name = "inria"
url = "https://gitlab.inria.fr/api/v4/projects/18692/packages/pypi/simple"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-rocm" }]
torchvision = [{ index = "pytorch-rocm" }]
torchaudio = [{ index = "pytorch-rocm" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm" }]
fbxsdkpy = [{ index = "inria" }]


[project.urls]
homepage = "https://www.comfy.org/"
repository = "https://github.com/comfyanonymous/ComfyUI"
documentation = "https://docs.comfy.org/"

[tool.ruff]
lint.select = [
  "N805", # invalid-first-argument-name-for-method
  "S307", # suspicious-eval-usage
  "S102", # exec
  "E",
  "T",    # print-usage
  "W",
  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
  # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
]

lint.ignore = ["E501", "E722", "E731", "E712", "E402", "E741"]

exclude = ["*.ipynb", "**/generated/*.pyi"]

[tool.pylint]
master.py-version = "3.10"
master.extension-pkg-allow-list = [
  "pydantic",
]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "line-too-long",
  "too-few-public-methods",
  "too-many-public-methods",
  "too-many-instance-attributes",
  "too-many-positional-arguments",
  "broad-exception-raised",
  "too-many-lines",
  "invalid-name",
  "unused-argument",
  "broad-exception-caught",
  "consider-using-with",
  "fixme",
  "too-many-statements",
  "too-many-branches",
  "too-many-locals",
  "too-many-arguments",
  "too-many-return-statements",
  "too-many-nested-blocks",
  "duplicate-code",
  "abstract-method",
  "superfluous-parens",
  "arguments-differ",
  "redefined-builtin",
  "unnecessary-lambda",
  "dangerous-default-value",
  "invalid-overridden-method",
  # next warnings should be fixed in future
  "bad-classmethod-argument",  # Class method should have 'cls' as first argument
  "wrong-import-order",  # Standard imports should be placed before third party imports
  "ungrouped-imports",
  "unnecessary-pass",
  "unnecessary-lambda-assignment",
  "no-else-return",
  "unused-variable",
]
